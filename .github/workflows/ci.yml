name: Verified local runtime
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/runtime/requirements*.txt
      - run: pip install -r backend/runtime/requirements-dev.txt
      - run: ruff check backend/runtime
      - run: ruff format --check backend/runtime
      - run: python -m pytest backend/runtime/tests -q --confcutdir=backend/runtime/tests
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/runtime/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local services
        run: |
          uvicorn backend.runtime.main:app --host 127.0.0.1 --port 8000 > /tmp/rag-api.log 2>&1 &
          cd frontend
          npm run start -- --hostname 127.0.0.1 > /tmp/rag-web.log 2>&1 &
      - name: Wait for web and API
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8000/health', 'http://127.0.0.1:3000']:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError('Service unavailable: ' + url)
          PY
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results
            /tmp/rag-api.log
            /tmp/rag-web.log
