# Local development only. See docs/engineering/OPERATIONS.md before deployment.
services:
  api:
    build:
      context: .
      dockerfile: backend/runtime/Dockerfile
    environment:
      RAG_PROVIDER: ${RAG_PROVIDER:-extractive}
      RAG_MODEL: ${RAG_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_ALLOW_REGISTRATION: ${RAG_ALLOW_REGISTRATION:-true}
      RAG_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - knowledge_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  knowledge_data:
